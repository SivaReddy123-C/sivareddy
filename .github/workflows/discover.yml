name: Discover boards

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: jobradar
        run: npm ci
      - name: Probe candidate names across five ATSs
        working-directory: jobradar
        run: npm run discover
      - name: Commit discovered boards
        run: |
          git config user.name "jobradar-discover"
          git config user.email "actions@users.noreply.github.com"
          git add jobradar/data/companies.seed.json
          if git diff --cached --quiet; then
            echo "No new boards discovered"
          else
            git commit -m "Discovery run: add newly found boards to seed"
            git push
          fi
