name: Sponsorship data

# Federal filings change quarterly at most, so this runs monthly rather than
# daily - and on demand when a new fiscal year file lands.
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sponsors:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: jobradar
        run: npm ci
      - name: Ingest USCIS H-1B employer data
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        working-directory: jobradar
        run: npm run sponsors
