name: Sponsorship data

# Federal filings change quarterly at most, so this runs monthly rather than
# daily - and on demand when a new fiscal year file lands.
on:
  # Paused 2026-08-27 at Siva's request - the project is stopped.
  # Uncomment these two lines to resume the nightly run.
  # schedule:
    #   - cron:  "23 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sponsors:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: jobradar
        run: npm ci
      - name: Ingest USCIS H-1B employer data
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        working-directory: jobradar
        run: npm run sponsors
      # The record count this run stored is what the public index quotes. It
      # has to be committed, or the page reports whatever the last commit said.
      - name: Commit the ingest record count
        if: always()
        run: |
          git config user.name "jobradar-sponsors"
          git config user.email "actions@users.noreply.github.com"
          git add jobradar/data/sponsor-meta.json || true
          if git diff --cached --quiet; then
            echo "No change to the record count"
          else
            git commit -m "Sponsors: record how many federal filings were ingested"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
