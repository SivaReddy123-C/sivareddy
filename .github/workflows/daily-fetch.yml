name: Daily fetch

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily; offset minute avoids the top-of-hour rush
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: jobradar
        run: npm ci
      - name: Fetch all boards
        working-directory: jobradar
        run: npm run fetch
      - name: Write daily stats
        working-directory: jobradar
        run: npm run stats
      - name: Write public jobs feed
        working-directory: jobradar
        run: npm run feed
      - name: Commit history and stats
        run: |
          git config user.name "jobradar-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -f jobradar/data/state.json
          git add jobradar/data/stats jobradar/data/feed.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily fetch: update longitudinal state and stats"
            git push
          fi
