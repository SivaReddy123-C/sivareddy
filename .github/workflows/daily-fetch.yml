name: Daily fetch

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily; offset minute avoids the top-of-hour rush
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: jobradar
        run: npm ci
      - name: Fetch all boards
        working-directory: jobradar
        run: npm run fetch
      - name: Write daily stats
        working-directory: jobradar
        run: npm run stats
      - name: Write public jobs feed
        working-directory: jobradar
        run: npm run feed
      # Built from the feed we just wrote, so it needs no database and runs
      # before sync. It used to run after, and a sync failure silently left the
      # public index stale for a day while every fact it needed sat in feed.json.
      - name: Rebuild the public sponsorship index
        working-directory: jobradar
        run: npm run sponsorpage
      - name: Sync to Supabase
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        working-directory: jobradar
        run: npm run sync
      - name: Rank user matches
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        working-directory: jobradar
        run: npm run rank
      # always(): fetch, stats and feed have already written their files by
      # now. A failure in sync or rank must never withhold the published feed
      # from every user - that mistake has already cost a day once.
      - name: Commit history and stats
        if: always()
        run: |
          git config user.name "jobradar-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -f jobradar/data/state.json
          git add jobradar/data/stats jobradar/data/feed.json
          git add jobradar/data/sponsor-meta.json || true
          git add app/public/sponsors.html || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily fetch: update longitudinal state and stats"
            # The run takes minutes and main moves under it (a merge, another
            # workflow). A bare push then rejects and fails the whole run at
            # the finish line. Rebase our one data commit onto whatever landed.
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
      # Notifications come last and never gate the data: publishing the feed
      # is the job, emailing about it is a courtesy. continue-on-error means a
      # mail outage cannot leave every user staring at yesterday's postings.
      - name: Email daily digests
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && env.RESEND_API_KEY != '' }}
        continue-on-error: true
        working-directory: jobradar
        run: npm run digest
